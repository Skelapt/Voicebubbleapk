name: voicebubble
description: "Voice-to-text AI rewriting assistant with floating overlay"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  confetti: ^0.7.0
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # Speech & Permissions
  # speech_to_text removed — not imported anywhere; we use the native
  # MediaRecorder + our backend's Whisper transcription instead.
  permission_handler: ^11.1.0
  record: ^6.2.0

  # Authentication
  # sign_in_with_apple removed — not imported anywhere (iOS-only auth
  # path that was never wired). Drops its native .so files.
  # EXACT pins (no ^) — pubspec.lock is not committed, so CI resolves
  # fresh every build. In July 2026 the resolver drifted onto
  # firebase_auth 6.5.5 / firebase_analytics 12.4.4 / cloud_firestore
  # 6.7.0, which are incompatible with the firebase_core our range
  # allows ("Type 'FirebasePlugin' not found") and broke bundleRelease.
  # These are the known-good versions the app was built against.
  firebase_core: 4.4.0
  firebase_auth: 6.1.4
  firebase_analytics: 12.1.2
  google_sign_in: ^6.2.1
  cloud_firestore: 6.1.2
  
  # In-App Purchases
  in_app_purchase: ^3.2.3

  # In-App Review
  in_app_review: ^2.0.8
  
  # Networking
  http: ^1.2.0
  dio: ^5.4.0
  
  # Android Overlay — removed. The bubble + recording panel are now
  # pure native (Kotlin WindowManager.addView). Removing this plugin
  # drops its .so files from the APK, helping 16 KB compliance and
  # shrinking download size.
  
  # File Sharing/Import
  receive_sharing_intent: ^1.8.0

  # Utilities
  intl: ^0.20.0
  uuid: ^4.3.3
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  file_picker: ^8.0.0+1
  image_picker: ^1.0.7
  just_audio: ^0.10.5
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  
  # Rich Text Editor
  flutter_quill: ^9.0.0
  # flutter_quill_extensions removed — not imported anywhere; was
  # pulling in super_native_extensions + irondash_engine_context
  # whose old .so files were the most likely 16 KB offenders.
  gal: 2.2.0  # Exact version to avoid compatibility issues
  
  # PDF Export
  pdf: ^3.10.4

  # PDF/Document Import (text extraction)
  syncfusion_flutter_pdf: ^32.2.3
  archive: ^3.4.10

  # OCR - Image text extraction
  google_mlkit_text_recognition: ^0.15.1

  # flutter_inappwebview removed — was previously force-overridden
  # via dependency_overrides but never imported anywhere. Drops
  # a large native WebView dependency.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/app_logo.png
    - assets/logo.png
    - assets/backgrounds/
  
  # Note: .env is not needed in production builds
  # API keys should be set as environment variables

# App Launcher Icon Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"
