name: Android APK Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: flutter_quill 9.2.3 doesn't implement
          # TextInputClient.onFocusReceived which Flutter 3.42+ requires,
          # so unpinned 'stable' (now 3.44.0) breaks the build. 3.35.6
          # matches the build-aab workflow and compiles cleanly.
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: 🔧 Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔍 Verify Flutter setup
        run: flutter doctor -v

      - name: 🧪 Run Flutter tests
        run: flutter test || echo "No tests found"
        continue-on-error: true

      - name: 🔐 Generate signing key
        run: |
          # Create a keystore for signing (self-signed for testing)
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/android/app/voicebubble-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -alias voicebubble \
            -dname "CN=VoiceBubble, OU=Development, O=VoiceBubble, L=Unknown, ST=Unknown, C=US"

      - name: 📝 Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=android
          keyPassword=android
          keyAlias=voicebubble
          storeFile=voicebubble-release.jks
          EOF

      - name: 🏗️ Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: 🚀 Build Signed Release APK
        if: github.event.inputs.build_type != 'debug' && github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: 📤 Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: voicebubble-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Signed Release APK
        if: github.event.inputs.build_type != 'debug' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: voicebubble-release-signed-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: 📊 Generate Build Summary
        if: always()
        run: |
          echo "## 🎉 VoiceBubble APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: ${{ github.event.inputs.build_type || 'release (SIGNED)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Version**: $(flutter --version | head -n1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "### 📦 Signed Release APK" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "- **Signing**: ✅ Self-signed (allows accessibility services)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "### 🐛 Debug APK" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: $(du -h build/app/outputs/flutter-apk/app-debug.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✨ Features" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **AI Voice-to-Text** (OpenAI Whisper)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Smart Rewriting** (GPT-4o-mini)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Floating Bubble** (Accessibility Service)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **40+ Writing Presets**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Works in ALL Apps**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Light/Dark Mode**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 Installation" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the **signed release APK** from artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Install on your Android device" >> $GITHUB_STEP_SUMMARY
          echo "3. Go to Settings → Accessibility" >> $GITHUB_STEP_SUMMARY
          echo "4. Enable **VoiceBubble - Voice to Text**" >> $GITHUB_STEP_SUMMARY
          echo "5. The floating bubble will appear! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download**: Check Artifacts section below" >> $GITHUB_STEP_SUMMARY
